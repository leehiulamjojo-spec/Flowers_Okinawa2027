<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFCF6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>沖繩春日海島之旅 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF6; --ink:#3E3A39;
  --coral:#F2A497; --yellow:#F6D27A; --water:#A8D3E6; --green:#B9DAA5;
  --line:3px solid var(--ink); --r:22px; --r-sm:14px;
  --shadow:3px 3px 0 var(--ink);
  --pad:12px; --navh:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:'Huninn',"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;font-size:16px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}

/* NAV */
.nav{position:fixed;inset:0 0 auto 0;z-index:50;background:var(--paper);border-bottom:var(--line);padding-top:env(safe-area-inset-top)}
.nav-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:6px;height:var(--navh);padding:0 max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:6px;font-size:1.05rem;text-decoration:none;white-space:nowrap;flex-shrink:0}
.brand svg{width:30px;height:30px}
.brand span{display:none}
.links{flex:1;min-width:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:4px 0;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(90deg,#000 88%,transparent)}
.links::-webkit-scrollbar{display:none}
.links a{white-space:nowrap;text-decoration:none;padding:4px 10px;border:2.5px solid transparent;border-radius:999px;font-size:.9rem}
.links a.on{border-color:var(--ink);background:var(--yellow)}
.ctrl{display:flex;gap:5px;flex-shrink:0}
.pill-btn{border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);min-width:40px;height:34px;padding:0 9px;font-size:.88rem;white-space:nowrap}
.pill-btn.lang{background:var(--water)}
.pill-btn[aria-pressed="true"]{background:var(--green)}
@media(min-width:720px){.brand span{display:inline}.links{mask-image:none}.links a:hover{border-color:var(--ink);background:var(--yellow)}}

/* LAYOUT */
main{padding-top:calc(var(--navh) + 14px + env(safe-area-inset-top))}
section{max-width:1000px;margin:0 auto 40px;padding:0 max(var(--pad),env(safe-area-inset-left));scroll-margin-top:calc(var(--navh) + 12px + env(safe-area-inset-top))}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-h h2{font-size:1.4rem;font-weight:400;background:linear-gradient(transparent 62%,var(--yellow) 62%);padding:0 4px}
.sec-h .em{width:40px;height:40px;border:var(--line);border-radius:50%;display:grid;place-items:center;font-size:1.2rem;background:var(--water);flex-shrink:0}
.card{background:var(--paper);border:var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{opacity:.72}
.chip{display:inline-block;border:2.5px solid var(--ink);border-radius:999px;padding:0 9px;font-size:.84rem;background:var(--paper);margin:2px 2px 2px 0}
.grid{display:grid;gap:14px}
@media(min-width:720px){:root{--pad:16px;--r:24px;--shadow:4px 4px 0 var(--ink)}section{margin-bottom:56px}.grid.g3{grid-template-columns:repeat(3,1fr)}.grid.g2{grid-template-columns:1fr 1fr}}

/* HERO */
.hero{padding:10px;overflow:hidden}
.hero-svg{width:100%;height:auto;display:block;border:var(--line);border-radius:var(--r-sm)}
.hero-txt{padding:4px 4px 2px}
.hero h1{font-weight:400;font-size:clamp(1.6rem,7vw,2.6rem);line-height:1.25;margin:14px 0 2px}
.hero .sub{font-size:1rem}
.cd-wrap{display:grid;gap:10px;margin:14px 0 4px}
.cd-box{border:var(--line);border-radius:var(--r-sm);padding:10px 8px}
.cd-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cd-h b{font-weight:400;border:2.5px solid var(--ink);border-radius:999px;padding:0 10px}
.cd-box.a .cd-h b{background:var(--coral)}.cd-box.b .cd-h b{background:var(--yellow)}
.cd-names{font-size:.84rem;opacity:.8;margin-top:4px}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:8px 0 4px}
.count div{border:2.5px solid var(--ink);border-radius:12px;text-align:center;padding:5px 0}
.count b{display:block;font-size:clamp(1.35rem,7vw,1.9rem);font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
.count small{font-size:.78rem}
.count div:nth-child(1){background:var(--coral)}.count div:nth-child(2){background:var(--yellow)}
.count div:nth-child(3){background:var(--water)}.count div:nth-child(4){background:var(--green)}
.count-lbl{font-size:.88rem}
@media(min-width:720px){.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:center;padding:20px}.hero h1{margin-top:0}}

/* SVG animation */
.anim{transform-box:fill-box;transform-origin:center}
.float{animation:float 4s ease-in-out infinite}
.bob{animation:bob 3s ease-in-out infinite}
.drift{animation:drift 9s ease-in-out infinite alternate}
.drift2{animation:drift 12s ease-in-out infinite alternate-reverse}
.spin{animation:spin 24s linear infinite}
.sway{animation:sway 3.5s ease-in-out infinite;transform-origin:left bottom}
.swim{animation:swim 7s ease-in-out infinite alternate}
.drive{animation:drive 8s linear infinite}
.roll{animation:roll 1.2s ease-in-out infinite}
@keyframes float{50%{transform:translate(8px,-6px)}}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}
@keyframes drift{to{transform:translateX(26px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{50%{transform:rotate(-5deg)}}
@keyframes swim{to{transform:translateX(40px)}}
@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(-150px)}}
@keyframes roll{50%{transform:translateY(-2px)}}

/* FLIGHTS */
.flight{overflow:hidden}
.band{padding:8px 14px;border-bottom:var(--line);display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.flight.a .band{background:var(--coral)}.flight.b .band{background:var(--yellow)}.flight.r .band{background:var(--water)}
.route{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 6px}
.route .code{font-size:1.9rem;line-height:1}
.route small{display:block;font-size:.8rem}
.route .mid{flex:1;margin:0 10px;border-top:3px dashed var(--ink);position:relative;height:0}
.route .mid svg{position:absolute;left:50%;top:-15px;width:30px;height:30px;transform:translateX(-50%)}
.perf{border-top:3px dashed var(--ink);margin:8px 0 0}
.f-body{padding:10px 14px 14px;font-size:.92rem}
.f-body label,.lbl{display:block;font-size:.76rem;opacity:.7}

/* CARS */
.car{overflow:hidden}
.car:nth-child(1) .band{background:var(--coral)}.car:nth-child(2) .band{background:var(--yellow)}.car:nth-child(3) .band{background:var(--green)}
.car-body{display:flex;gap:12px;align-items:center;padding:12px 14px}
.car-body svg{width:76px;height:52px;flex-shrink:0}
.car-info{display:grid;gap:4px;font-size:.95rem;min-width:0}
.car-name{font-size:1.15rem}
.car-tip{margin-top:14px;padding:12px 14px;font-size:.92rem}
.car-tip ul{padding-left:1.2em}

/* ITINERARY */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 calc(-1 * var(--pad));padding-left:var(--pad);padding-right:var(--pad)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;scroll-snap-align:center;border:var(--line);border-radius:16px;background:var(--paper);padding:6px 10px;text-align:center;min-width:70px;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s}
.tab b{display:block;font-weight:400;font-size:1rem}
.tab small{font-size:.76rem}
.tab.on{background:var(--coral);transform:translateY(-4px);box-shadow:0 4px 0 var(--ink)}
.tab .tm{display:block;font-size:.7rem;border-top:2px dashed var(--ink);margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;font-size:.84rem;align-items:center}
.day{padding:12px 10px}
.day.pop{animation:pop .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{0%{transform:translateY(14px) scale(.97);opacity:0}60%{transform:translateY(-5px) scale(1.01);opacity:1}100%{transform:none}}
.day-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.day-head .ill{width:62px;height:62px;flex-shrink:0;border:var(--line);border-radius:16px;background:var(--paper);overflow:hidden}
.day-head h3{font-weight:400;font-size:1.15rem;line-height:1.35}
.day-meta{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.chip.team-a{background:var(--coral)}.chip.all{background:var(--green)}.chip.stay{background:var(--water)}
.opts{display:flex;border:var(--line);border-radius:999px;overflow:hidden;margin:2px 0 12px}
.opts button{flex:1;border:0;background:var(--paper);padding:6px 8px;font-size:.92rem}
.opts button+button{border-left:var(--line)}
.opts button.on{background:var(--yellow)}
.tl{list-style:none;position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;border-left:3px dashed var(--ink)}
.tl-item{position:relative;margin-bottom:10px}
.tl-item .dot{position:absolute;left:-24px;top:14px;width:18px;height:18px;border:var(--line);border-radius:50%;background:var(--paper)}
.dot.car{background:var(--yellow)}.dot.plane{background:var(--coral)}.dot.boat,.dot.dive{background:var(--water)}.dot.walk{background:var(--green)}
.dot.both{background:conic-gradient(var(--water) 0 50%,var(--coral) 0)}
.tl-card{border:2.5px solid var(--ink);border-radius:var(--r-sm);padding:9px 11px;background:var(--paper)}
.tl-card.must{background:#FFF4E6}
.tl-top{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:.78rem}
.slot{border:2px solid var(--ink);border-radius:8px;padding:0 6px}
.badge-must{background:var(--coral);border:2px solid var(--ink);border-radius:999px;padding:0 8px}
.badge-opt{border:2px dashed var(--ink);border-radius:999px;padding:0 8px}
.tl-card h4{font-weight:400;font-size:1.02rem;margin:4px 0 2px;display:flex;gap:6px;align-items:flex-start;line-height:1.45}
.note{font-size:.86rem;opacity:.8}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.tag{font-size:.76rem;border:2px solid var(--ink);border-radius:999px;padding:0 8px;white-space:nowrap}
.tag.car{background:var(--yellow)}.tag.plane{background:var(--coral)}.tag.boat{background:var(--water)}.tag.walk{background:var(--green)}
.tag.dive{background:var(--water);border-style:dashed}
.map{font-size:.8rem;text-decoration:none;border-bottom:2px solid var(--ink);padding:2px 0}
.split-wrap{display:grid;gap:8px}
@media(min-width:640px){.split-wrap{grid-template-columns:1fr 1fr}.day{padding:16px}.tl{padding-left:32px}.tl::before{left:12px}.tl-item .dot{left:-31px;width:22px;height:22px}.day-head .ill{width:76px;height:76px}}
.team-col{border:2.5px solid var(--ink);border-radius:var(--r-sm);overflow:hidden}
.team-h{padding:4px 11px;border-bottom:2.5px solid var(--ink)}
.team-col.dive .team-h{background:var(--water)}.team-col.bb .team-h{background:var(--coral)}
.mini{list-style:none;padding:6px 11px}
.mini li{padding:6px 0;border-bottom:2px dotted rgba(62,58,57,.35)}
.mini li:last-child{border-bottom:0}
.mini .nm{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}

/* STAY */
.stay-card{overflow:hidden}
.stay-card .top{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:var(--line)}
.stay-card:nth-child(1) .top{background:var(--green)}.stay-card:nth-child(2) .top{background:var(--water)}
.stay-card .top svg{width:52px;height:52px;flex-shrink:0}
.stay-card h3{font-weight:400;font-size:1.12rem;line-height:1.3;word-break:break-word}
.stay-rows{padding:10px 14px 14px;display:grid;gap:10px}
.stay-rows .val{font-size:.95rem;word-break:break-word}
.ci{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ci div{border:2.5px solid var(--ink);border-radius:12px;padding:6px 10px}
.ci div:first-child{background:#EEF7E8}.ci div:last-child{background:#FDECE8}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.lbtn{display:inline-flex;align-items:center;gap:6px;border:2.5px solid var(--ink);border-radius:999px;padding:6px 14px;text-decoration:none;background:var(--yellow);font-size:.92rem;min-height:40px}
.lbtn.alt{background:var(--water)}
.lbtn.map2{background:var(--paper)}

/* LISTS */
.list-card{padding:14px 12px}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar{flex:1;height:16px;border:var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.bar span{display:block;height:100%;background:var(--green);border-right:3px solid var(--ink);transition:width .4s cubic-bezier(.3,1.5,.5,1)}
.grp{margin-top:10px}
.grp h4{font-weight:400;display:inline-block;border:2.5px solid var(--ink);border-radius:999px;padding:0 12px;margin-bottom:4px;background:var(--yellow)}
.checks{list-style:none}
.checks li{display:flex;align-items:center;gap:8px;border-bottom:2px dotted rgba(62,58,57,.3)}
.checks label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;padding:9px 0;min-height:44px}
.checks input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:var(--line);border-radius:9px;background:var(--paper);display:grid;place-items:center;flex-shrink:0;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.checks input:checked{background:var(--green);transform:scale(1.08)}
.checks input:checked::after{content:"✓";font-size:1rem;line-height:1}
.checks input:checked+span{text-decoration:line-through;text-decoration-thickness:2px;opacity:.55}
.del{border:0;background:none;font-size:1.05rem;opacity:.6;width:40px;height:40px}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1;min-width:0;border:var(--line);border-radius:999px;padding:8px 14px;background:var(--paper);font-size:16px}
.add button{border:var(--line);border-radius:999px;background:var(--coral);padding:0 14px;white-space:nowrap}
.cols{display:grid;gap:0;max-width:1000px;margin:0 auto}
@media(min-width:860px){.cols.two{grid-template-columns:1fr 1fr;gap:16px}}

footer{text-align:center;padding:6px 16px calc(36px + env(safe-area-inset-bottom));font-size:.88rem}

html.reduce *,html.reduce *::before,html.reduce *::after{animation:none!important;transition:none!important}
html.reduce{scroll-behavior:auto}
</style>
</head>

  <div class="nav-in">
    <a class="brand" href="#home" aria-label="Home">
      <svg viewBox="0 0 40 40" aria-hidden="true"><g stroke="#3E3A39" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">

        <circle cx="20" cy="20" r="3" fill="#FFFCF6"/></g></svg>

    <div class="links" id="links">
      <a href="#home" data-i18n="nHome">首頁</a>

</nav>

<main>
<section id="home">
  <div class="card hero">
    <svg class="hero-svg" viewBox="0 0 400 260" role="img" aria-label="Okinawa illustration">

        <circle cx="123" cy="120" r="6" fill="#F6D27A"/><path d="M119 116 L117 112 M127 116 L129 112" fill="none" stroke-width="2.5"/>
        <path d="M58 172 C56 150 60 130 68 112 L74 114 C68 132 66 152 68 172 Z" fill="#F6D27A"/>
        <g transform="translate(71 112)">
          <g class="anim sway">
            <path d="M0 0 C-10 -12 -28 -12 -38 -2 C-24 -6 -12 -4 0 0Z" fill="#B9DAA5"/>

            <path d="M0 0 C4 -14 16 -24 26 -24 C14 -18 6 -10 0 0Z" fill="#B9DAA5"/>

        <g transform="translate(258 190)">
          <g class="anim bob">
            <path d="M14 -6 V-28 L32 -10 Z" fill="#F6D27A"/>

            <circle cx="24" cy="2" r="2.5" fill="#FFFCF6" stroke-width="2"/>
          </g>

        <g transform="translate(40 224)">

const LISTS=[{el:'todoList',key:'oki-todo',groups:TODO},{el:'preList',key:'oki-pre',groups:PRE},{el:'packList',key:'oki-pack',groups:PACK}];
const getS=k=>{try{return JSON.parse(localStorage.getItem(k))||{done:[],custom:[]}}catch(_){return {done:[],custom:[]}}};
function renderList(L){
  const st=getS(L.key),done=new Set(st.done);
  const all=L.groups.flatMap(g=>g.items.map(x=>x[0])).concat(st.custom.map(c=>c.id));
  const n=all.filter(id=>done.has(id)).length,pct=all.length?Math.round(n/all.length*100):0;
  const li=(id,label,custom)=>`<li><label><input type="checkbox" data-id="${id}" ${done.has(id)?'checked':''}><span>${label}</span></label>${custom?`<button class="del" data-del="${id}" aria-label="delete">✕</button>`:''}</li>`;
  let h=`<div class="prog"><div class="bar"><span style="width:${pct}%"></span></div><b style="font-weight:400">${n}/${all.length}</b></div>`;
  L.groups.forEach(g=>{h+=`<div class="grp">${g.title?`<h4>${t(g.title)}</h4>`:''}<ul class="checks">${g.items.map(x=>li(x[0],lang==='zh'?x[1]:x[2])).join('')}</ul></div>`});
  if(st.custom.length)h+=`<div class="grp">${L.groups[0].title?`<h4>${t(['其他','Others'])}</h4>`:''}<ul class="checks">${st.custom.map(c=>li(c.id,esc(c.text),1)).join('')}</ul></div>`;
  h+=`<form class="add"><input type="text" placeholder="${u('addPh')}" aria-label="${u('addPh')}" maxlength="80" enterkeyhint="done"><button type="submit">＋ ${u('add')}</button></form>`;
  document.getElementById(L.el).innerHTML=h;
}
LISTS.forEach(L=>{
  const box=document.getElementById(L.el);
  box.addEventListener('change',e=>{const id=e.target.dataset.id;if(!id)return;const st=getS(L.key);
    st.done=e.target.checked?[...new Set([...st.done,id])]:st.done.filter(x=>x!==id);localStorage.setItem(L.key,JSON.stringify(st));
    const all=box.querySelectorAll('input[type=checkbox]'),c=box.querySelectorAll('input:checked').length;
    box.querySelector('.bar span').style.width=Math.round(c/all.length*100)+'%';box.querySelector('.prog b').textContent=c+'/'+all.length;});
  box.addEventListener('click',e=>{const id=e.target.dataset&&e.target.dataset.del;if(!id)return;const st=getS(L.key);
    st.custom=st.custom.filter(c=>c.id!==id);st.done=st.done.filter(x=>x!==id);localStorage.setItem(L.key,JSON.stringify(st));renderList(L);});
  box.addEventListener('submit',e=>{e.preventDefault();const inp=e.target.querySelector('input'),v=inp.value.trim();if(!v)return;
    const st=getS(L.key);st.custom.push({id:'c'+Date.now(),text:v});localStorage.setItem(L.key,JSON.stringify(st));renderList(L);});
});

/* Countdowns (HK time 00:00) */
const END=new Date('2027-04-12T00:00:00+08:00');
const CDS=[{p:'a',start:new Date('2027-04-04T00:00:00+08:00'),lbl:'cdA'},{p:'b',start:new Date('2027-04-07T00:00:00+08:00'),lbl:'cdB'}];
function tick(){
  const now=new Date();
  CDS.forEach(c=>{
    let diff=c.start-now;const lbl=document.getElementById(c.p+'Lbl');
    if(diff<=0){diff=0;lbl.textContent=now<END?u('cdDuring'):u('cdAfter')}else lbl.textContent=u(c.lbl);
    const s=Math.floor(diff/1000),g=x=>document.getElementById(c.p+x);
    g('D').textContent=Math.floor(s/86400);
    g('H').textContent=String(Math.floor(s%86400/3600)).padStart(2,'0');
    g('M').textContent=String(Math.floor(s%3600/60)).padStart(2,'0');
    g('S').textContent=String(s%60).padStart(2,'0');
  });
}

}
document.getElementById('motionBtn').addEventListener('click',()=>{reduce=!reduce;localStorage.setItem('oki-reduce',reduce?'1':'0');setMotionBtn()});
mq.addEventListener&&mq.addEventListener('change',e=>{if(localStorage.getItem('oki-reduce')===null){reduce=e.matches;setMotionBtn()}});

/* Active nav link + keep it visible on iPhone */
const navLinks=[...document.querySelectorAll('#links a')];
const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){navLinks.forEach(a=>{const on=a.getAttribute('href')==='#'+en.target.id;a.classList.toggle('on',on);
  if(on){const box=document.getElementById('links');box.scrollTo({left:a.offsetLeft-box.clientWidth/2+a.clientWidth/2,behavior:reduce?'auto':'smooth'})}})}}),{rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('main section').forEach(s=>io.observe(s));

function renderAll(){applyStatic();renderFlights();renderCars();renderTabs();renderDay(false);renderStays();LISTS.forEach(renderList);tick()}
document.getElementById('langBtn').addEventListener('click',()=>{lang=lang==='zh'?'en':'zh';localStorage.setItem('oki-lang',lang);renderAll()});
(function(){const n=new Date(),k=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
  const i=DAYS.findIndex(d=>d.date===k);if(i>=0)cur=i;})();
renderAll();setInterval(tick,1000);
</script>
